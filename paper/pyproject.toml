[project]
name = "pland-paper"
version = "0.1.0"
description = "Reproducible SAS Publishers manuscript build for PLaND"
requires-python = ">=3.11"
dependencies = [
  "cairosvg>=2.7,<3",
  "pillow>=10,<13",
  "python-docx>=1.1,<2",
  "reportlab>=4,<5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pland]
paid-services = false
output-format = "docx"
page-size = "A4"
font = "Times New Roman"
font-size-points = 10
