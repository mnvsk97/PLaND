requires-python = ">=3.11"
dependencies = [
  "liteparse==2.14.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pland]
paid-services = false
local-runtime = ["ollama", "liteparse"]
