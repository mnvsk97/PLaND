[project]
name = "pland-reproduction"
version = "0.1.0"
description = "Locked environment for reproducing and verifying the PLaND repository"
requires-python = ">=3.11,<3.15"
dependencies = [
  "deepagents==0.7.12",
  "langchain-ollama==1.1.0",
  "liteparse==2.14.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv]
package = false
